<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Frame Launcher</title>
<style>html, body { margin: 0; background: #06080d; }</style>
</head>
<body>
<script>
// Lader: holt app.html in der neuesten Commit-Version. Der unversionierte jsDelivr-Pfad,
// über den TizenBrew dieses Modul lädt, hängt nach Updates teils stundenlang hinterher.
(function () {
  var REPO = 'hando8488/frame_launcher';
  var cached = null;
  try { cached = localStorage.getItem('fl.ref'); } catch (e) {}

  function show(ref) {
    return fetch('https://cdn.jsdelivr.net/gh/' + REPO + '@' + ref + '/app/app.html')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (html) {
        try { localStorage.setItem('fl.ref', ref); } catch (e) {}
        document.open();
        document.write(html);
        document.close();
      });
  }

  var latest = fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github.sha' } })
    .then(function (r) { return r.text(); })
    .then(function (sha) { sha = sha.trim(); if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('sha'); return sha; });
  var timeout = new Promise(function (ok, fail) { setTimeout(fail, 2500); });

  Promise.race([latest, timeout])
    .then(show)
    .catch(function () { return show(cached || 'main'); })
    .catch(function () { return show('main'); })
    .catch(function () {
      document.body.innerHTML = '<p style="color:#fff;font:32px sans-serif;padding:80px">Launcher konnte nicht geladen werden – Internet?</p>';
    });
})();
</script>
</body>
</html>
